            -e ACESTEP_MUSIC_API_KEY -e ACESTEP_MUSIC_BASE_URL -e ACESTEP_MUSIC_MODEL \
            -e GATEWAY_API_KEY \
            ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}

      - name: Install e2e runner deps
        run: pip install --quiet httpx

      - name: Run e2e smoke
        env:
          # *_IMAGE_* / *_VIDEO_* / *_MUSIC_* API_KEY are secrets; the
          # *_BASE_URL / *_MODEL in each triple are variables (not sensitive),
          # matching the gate and the container-start step — so the smoke script
          # sees the same triple each provider modality was gated on.
          MM_GATEWAY: http://127.0.0.1:8000
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
