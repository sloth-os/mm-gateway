name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Run the real-provider e2e against the built image"
        type: boolean
        default: false

# Prefer a single, sequential flow: build once, then run lint + unit tests +
# image-build on that build, then (optionally) e2e against the built image.
# This avoids rebuilding the image for e2e and keeps the run cheap when secrets
# are absent (which is the "I will set secrets later" case).
jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    # Provider credentials live in the `ci` environment: *_IMAGE_API_KEY /
    # *_VIDEO_API_KEY / *_MUSIC_API_KEY as secrets and the matching *_BASE_URL /
    # *_MODEL as variables (they are not sensitive). A job only receives
    # environment-scoped secrets/vars when it declares the environment, so attach
    # it here (and on e2e) — otherwise the gate below sees nothing.
    environment: ci
    timeout-minutes: 15
    outputs:
      # Whether at least one provider modality is *fully* configured (its
      # *_IMAGE_* / *_VIDEO_* / *_MUSIC_* triple of API_KEY + BASE_URL + MODEL all
      # set). The e2e job gates on this OR on the manual run-e2e flag, so it only
      # fires when there is a real, operator-pinned model to exercise — not merely
      # when a stray key exists.
      secrets_present: ${{ steps.secret_gate.outputs.secrets_present }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (with dev deps)
        run: pip install -e ".[dev]"

      - name: Import check (every provider module imports)
        # Import each provider adapter module (which transitively imports its
        # upstream SDK) plus the gateway's own core deps. A backend whose SDK
        # fails to install/import here is also unimportable in the built image,
        # so the registry would skip it at runtime — catch that now rather than
        # in the e2e. Iterates the providers package dynamically so a new
        # provider module is covered without touching this list.
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import mm_gateway.providers as pkg
          missing = []
          for mod in pkgutil.iter_modules(pkg.__path__):
              if mod.name.startswith("_"):
                  continue
              try:
                  importlib.import_module(f"{pkg.__name__}.{mod.name}")
              except Exception as exc:  # noqa: BLE001
                  missing.append(f"provider {mod.name}: {exc}")
          for core in ("fastapi", "uvicorn", "httpx", "yaml", "mcp"):
              try:
                  importlib.import_module(core)
              except Exception as exc:  # noqa: BLE001
                  missing.append(f"{core}: {exc}")
          if missing:
              raise SystemExit("missing/failed imports:\n" + "\n".join(missing))
          print("all provider + core import check modules OK")
          PY

      - name: Run unit tests
        run: pytest -q

      # Detect whether at least one provider modality is *fully* configured — all
      # three of its *_IMAGE_* / *_VIDEO_* / *_MUSIC_* triple (API_KEY + BASE_URL +
      # MODEL) set — *without* printing any of them. `secrets.*` references are
      # silently absent (empty) when the secret is not defined, so this only flips
      # true once you wire a real provider modality in Settings. "Fully
      # configured" matches the e2e's own gate (a backend modality runs the e2e
      # iff all three are set), so the job fires only when there's a real,
      # operator-pinned model to call.
      - name: Detect fully-configured provider
        id: secret_gate
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_IMAGE_BASE_URL: ${{ vars.OPENAI_IMAGE_BASE_URL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_VIDEO_API_KEY: ${{ secrets.OPENAI_VIDEO_API_KEY }}
          OPENAI_VIDEO_BASE_URL: ${{ vars.OPENAI_VIDEO_BASE_URL }}
          OPENAI_VIDEO_MODEL: ${{ vars.OPENAI_VIDEO_MODEL }}
          ARK_IMAGE_API_KEY: ${{ secrets.ARK_IMAGE_API_KEY }}
          ARK_IMAGE_BASE_URL: ${{ vars.ARK_IMAGE_BASE_URL }}
          ARK_IMAGE_MODEL: ${{ vars.ARK_IMAGE_MODEL }}
          ARK_VIDEO_API_KEY: ${{ secrets.ARK_VIDEO_API_KEY }}
          ARK_VIDEO_BASE_URL: ${{ vars.ARK_VIDEO_BASE_URL }}
          ARK_VIDEO_MODEL: ${{ vars.ARK_VIDEO_MODEL }}
          GOOGLE_IMAGE_API_KEY: ${{ secrets.GOOGLE_IMAGE_API_KEY }}
          GOOGLE_IMAGE_BASE_URL: ${{ vars.GOOGLE_IMAGE_BASE_URL }}
          GOOGLE_IMAGE_MODEL: ${{ vars.GOOGLE_IMAGE_MODEL }}
          GOOGLE_VIDEO_API_KEY: ${{ secrets.GOOGLE_VIDEO_API_KEY }}
          GOOGLE_VIDEO_BASE_URL: ${{ vars.GOOGLE_VIDEO_BASE_URL }}
          GOOGLE_VIDEO_MODEL: ${{ vars.GOOGLE_VIDEO_MODEL }}
          XAI_IMAGE_API_KEY: ${{ secrets.XAI_IMAGE_API_KEY }}
          XAI_IMAGE_BASE_URL: ${{ vars.XAI_IMAGE_BASE_URL }}
          XAI_IMAGE_MODEL: ${{ vars.XAI_IMAGE_MODEL }}
          XAI_VIDEO_API_KEY: ${{ secrets.XAI_VIDEO_API_KEY }}
          XAI_VIDEO_BASE_URL: ${{ vars.XAI_VIDEO_BASE_URL }}
          XAI_VIDEO_MODEL: ${{ vars.XAI_VIDEO_MODEL }}
          FLUX_IMAGE_API_KEY: ${{ secrets.FLUX_IMAGE_API_KEY }}
          FLUX_IMAGE_BASE_URL: ${{ vars.FLUX_IMAGE_BASE_URL }}
          FLUX_IMAGE_MODEL: ${{ vars.FLUX_IMAGE_MODEL }}
          FLUX_VIDEO_API_KEY: ${{ secrets.FLUX_VIDEO_API_KEY }}
          FLUX_VIDEO_BASE_URL: ${{ vars.FLUX_VIDEO_BASE_URL }}
          FLUX_VIDEO_MODEL: ${{ vars.FLUX_VIDEO_MODEL }}
          DASHSCOPE_IMAGE_API_KEY: ${{ secrets.DASHSCOPE_IMAGE_API_KEY }}
          DASHSCOPE_IMAGE_BASE_URL: ${{ vars.DASHSCOPE_IMAGE_BASE_URL }}
          DASHSCOPE_IMAGE_MODEL: ${{ vars.DASHSCOPE_IMAGE_MODEL }}
          DASHSCOPE_VIDEO_API_KEY: ${{ secrets.DASHSCOPE_VIDEO_API_KEY }}
          DASHSCOPE_VIDEO_BASE_URL: ${{ vars.DASHSCOPE_VIDEO_BASE_URL }}
          DASHSCOPE_VIDEO_MODEL: ${{ vars.DASHSCOPE_VIDEO_MODEL }}
          STABILITY_IMAGE_API_KEY: ${{ secrets.STABILITY_IMAGE_API_KEY }}
          STABILITY_IMAGE_BASE_URL: ${{ vars.STABILITY_IMAGE_BASE_URL }}
          STABILITY_IMAGE_MODEL: ${{ vars.STABILITY_IMAGE_MODEL }}
          STABILITY_VIDEO_API_KEY: ${{ secrets.STABILITY_VIDEO_API_KEY }}
          STABILITY_VIDEO_BASE_URL: ${{ vars.STABILITY_VIDEO_BASE_URL }}
          STABILITY_VIDEO_MODEL: ${{ vars.STABILITY_VIDEO_MODEL }}
          OPENROUTER_IMAGE_API_KEY: ${{ secrets.OPENROUTER_IMAGE_API_KEY }}
          OPENROUTER_IMAGE_BASE_URL: ${{ vars.OPENROUTER_IMAGE_BASE_URL }}
          OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
          OPENROUTER_VIDEO_API_KEY: ${{ secrets.OPENROUTER_VIDEO_API_KEY }}
          OPENROUTER_VIDEO_BASE_URL: ${{ vars.OPENROUTER_VIDEO_BASE_URL }}
          OPENROUTER_VIDEO_MODEL: ${{ vars.OPENROUTER_VIDEO_MODEL }}
          MINIMAX_VIDEO_API_KEY: ${{ secrets.MINIMAX_VIDEO_API_KEY }}
          MINIMAX_VIDEO_BASE_URL: ${{ vars.MINIMAX_VIDEO_BASE_URL }}
          MINIMAX_VIDEO_MODEL: ${{ vars.MINIMAX_VIDEO_MODEL }}
          GOOGLE_MUSIC_API_KEY: ${{ secrets.GOOGLE_MUSIC_API_KEY }}
          GOOGLE_MUSIC_BASE_URL: ${{ vars.GOOGLE_MUSIC_BASE_URL }}
          GOOGLE_MUSIC_MODEL: ${{ vars.GOOGLE_MUSIC_MODEL }}
          ELEVENLABS_MUSIC_API_KEY: ${{ secrets.ELEVENLABS_MUSIC_API_KEY }}
          ELEVENLABS_MUSIC_BASE_URL: ${{ vars.ELEVENLABS_MUSIC_BASE_URL }}
          ELEVENLABS_MUSIC_MODEL: ${{ vars.ELEVENLABS_MUSIC_MODEL }}
          MINIMAX_MUSIC_API_KEY: ${{ secrets.MINIMAX_MUSIC_API_KEY }}
          MINIMAX_MUSIC_BASE_URL: ${{ vars.MINIMAX_MUSIC_BASE_URL }}
          MINIMAX_MUSIC_MODEL: ${{ vars.MINIMAX_MUSIC_MODEL }}
          UDIOAPI_MUSIC_API_KEY: ${{ secrets.UDIOAPI_MUSIC_API_KEY }}
          UDIOAPI_MUSIC_BASE_URL: ${{ vars.UDIOAPI_MUSIC_BASE_URL }}
          UDIOAPI_MUSIC_MODEL: ${{ vars.UDIOAPI_MUSIC_MODEL }}
          MUREKA_MUSIC_API_KEY: ${{ secrets.MUREKA_MUSIC_API_KEY }}
          MUREKA_MUSIC_BASE_URL: ${{ vars.MUREKA_MUSIC_BASE_URL }}
          MUREKA_MUSIC_MODEL: ${{ vars.MUREKA_MUSIC_MODEL }}
          ACESTEP_MUSIC_API_KEY: ${{ secrets.ACESTEP_MUSIC_API_KEY }}
          ACESTEP_MUSIC_BASE_URL: ${{ vars.ACESTEP_MUSIC_BASE_URL }}
          ACESTEP_MUSIC_MODEL: ${{ vars.ACESTEP_MUSIC_MODEL }}
        run: |
          set=0
          # A provider modality is "fully configured" iff all three of its
          # *_IMAGE_* / *_VIDEO_* / *_MUSIC_* triple are set. The e2e runs iff at
          # least one modality of one provider is fully configured.
          for triple in \
            "${OPENAI_IMAGE_API_KEY}:${OPENAI_IMAGE_BASE_URL}:${OPENAI_IMAGE_MODEL}" \
            "${OPENAI_VIDEO_API_KEY}:${OPENAI_VIDEO_BASE_URL}:${OPENAI_VIDEO_MODEL}" \
            "${ARK_IMAGE_API_KEY}:${ARK_IMAGE_BASE_URL}:${ARK_IMAGE_MODEL}" \
            "${ARK_VIDEO_API_KEY}:${ARK_VIDEO_BASE_URL}:${ARK_VIDEO_MODEL}" \
            "${GOOGLE_IMAGE_API_KEY}:${GOOGLE_IMAGE_BASE_URL}:${GOOGLE_IMAGE_MODEL}" \
            "${GOOGLE_VIDEO_API_KEY}:${GOOGLE_VIDEO_BASE_URL}:${GOOGLE_VIDEO_MODEL}" \
            "${XAI_IMAGE_API_KEY}:${XAI_IMAGE_BASE_URL}:${XAI_IMAGE_MODEL}" \
            "${XAI_VIDEO_API_KEY}:${XAI_VIDEO_BASE_URL}:${XAI_VIDEO_MODEL}" \
            "${FLUX_IMAGE_API_KEY}:${FLUX_IMAGE_BASE_URL}:${FLUX_IMAGE_MODEL}" \
            "${FLUX_VIDEO_API_KEY}:${FLUX_VIDEO_BASE_URL}:${FLUX_VIDEO_MODEL}" \
            "${DASHSCOPE_IMAGE_API_KEY}:${DASHSCOPE_IMAGE_BASE_URL}:${DASHSCOPE_IMAGE_MODEL}" \
            "${DASHSCOPE_VIDEO_API_KEY}:${DASHSCOPE_VIDEO_BASE_URL}:${DASHSCOPE_VIDEO_MODEL}" \
            "${STABILITY_IMAGE_API_KEY}:${STABILITY_IMAGE_BASE_URL}:${STABILITY_IMAGE_MODEL}" \
            "${STABILITY_VIDEO_API_KEY}:${STABILITY_VIDEO_BASE_URL}:${STABILITY_VIDEO_MODEL}" \
            "${OPENROUTER_IMAGE_API_KEY}:${OPENROUTER_IMAGE_BASE_URL}:${OPENROUTER_IMAGE_MODEL}" \
            "${OPENROUTER_VIDEO_API_KEY}:${OPENROUTER_VIDEO_BASE_URL}:${OPENROUTER_VIDEO_MODEL}" \
            "${MINIMAX_VIDEO_API_KEY}:${MINIMAX_VIDEO_BASE_URL}:${MINIMAX_VIDEO_MODEL}" \
            "${GOOGLE_MUSIC_API_KEY}:${GOOGLE_MUSIC_BASE_URL}:${GOOGLE_MUSIC_MODEL}" \
            "${ELEVENLABS_MUSIC_API_KEY}:${ELEVENLABS_MUSIC_BASE_URL}:${ELEVENLABS_MUSIC_MODEL}" \
            "${MINIMAX_MUSIC_API_KEY}:${MINIMAX_MUSIC_BASE_URL}:${MINIMAX_MUSIC_MODEL}" \
            "${UDIOAPI_MUSIC_API_KEY}:${UDIOAPI_MUSIC_BASE_URL}:${UDIOAPI_MUSIC_MODEL}" \
            "${MUREKA_MUSIC_API_KEY}:${MUREKA_MUSIC_BASE_URL}:${MUREKA_MUSIC_MODEL}" \
            "${ACESTEP_MUSIC_API_KEY}:${ACESTEP_MUSIC_BASE_URL}:${ACESTEP_MUSIC_MODEL}" \
          ; do
            # Split on ':' — all three fields must be non-empty.
            IFS=':' read -r k u m <<< "$triple"
            if [ -n "$k" ] && [ -n "$u" ] && [ -n "$m" ]; then set=1; break; fi
          done
          echo "secrets_present=$set" >> "$GITHUB_OUTPUT"
          echo "secrets_present=$set"

  # Build each architecture natively (amd64 on an amd64 runner, arm64 on an
  # arm64 runner) instead of cross-building arm64 under QEMU emulation. QEMU had
  # to compile the C-extension provider deps from source for arm64 — a single
  # `pip install .` step that took ~10 min under emulation vs ~2 min native.
  # Each leg pushes a *single-arch* image tagged `sha-<arch>-<short>`; the
  # `manifest` job below assembles them into one multi-arch manifest list and
  # publishes the canonical tags (latest / branch / semver / sha-<short>).
  build:
    name: Build (${{ matrix.arch }})
    needs: lint-and-test
    # Both arches build on every event — including PRs. The legs run in parallel
    # on free native runners, so a PR costs no extra wall-clock (its duration is
    # the slower leg, ~2-3 min) and catches arm64 regressions early. `manifest`
    # and `e2e` below are gated off PR, so a PR never publishes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (per-arch slice)
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Publish to Docker Hub (<username>/<repo>) ONLY when DOCKERHUB_USERNAME
          # is set; otherwise this line is empty and metadata-action drops it,
          # so only GHCR is targeted. Keeps the build green before Docker Hub
          # creds exist (the "stay green before secrets are set" contract).
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          # Push a single per-arch tag only; the manifest job owns the canonical
          # (latest/branch/semver/sha-) tags. `latest=false` stops metadata-action
          # from also tagging this slice `latest`, which would race the manifest
          # job and could overwrite a multi-arch `latest` with a single-arch one.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-${{ matrix.arch }}-,format=short

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        # `secrets` is not allowed in a step `if`, so surface presence as an
        # output here (env may reference secrets) and gate the login below on it.
        id: dockerhub
        if: github.event_name != 'pull_request'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        # Opt-in: only log in (and only the Docker Hub image is in `images`)
        # when both DOCKERHUB creds are set as secrets. Without them the build
        # still pushes to GHCR and stays green.
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push arch slice
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Single platform per leg — built natively on the matching runner.
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip provenance/attestation on the per-arch slices so the manifest
          # job can merge them cleanly with `imagetools create` (attestation
          # manifests would otherwise complicate the source image refs).
          provenance: false
          sbom: false
          # Per-arch cache scope: amd64 and arm64 layers are not interchangeable,
          # and scoping avoids any cross-leg cache write race inside one gha scope.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          build-args: |
            PYTHON_VERSION=3.12

  # Assemble the per-arch slices (sha-amd64-<short>, sha-arm64-<short>) pushed by
  # the matrix above into a single multi-arch manifest list, published under the
  # canonical tags the e2e job and consumers pull. No image is rebuilt here —
  # `imagetools create` just merges the existing arch manifests by reference.
  manifest:
    name: Assemble multi-arch manifest
    needs: build
    if: ${{ github.event_name != 'pull_request' && success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (canonical tags)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) || '' }}
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Assemble multi-arch manifest list
        # `imagetools create` merges the per-arch images into one manifest list
        # under each canonical tag. Iterates the metadata-action tag list so every
        # target (GHCR + Docker Hub, latest/branch/semver/sha) gets a manifest.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ${{ github.repository }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHORT_SHA::7}"
          for tag in $TAGS; do
            echo "::group::Assembling $tag"
            docker buildx imagetools create \
              -t "$tag" \
              "ghcr.io/${REPO}:sha-amd64-${short}" \
              "ghcr.io/${REPO}:sha-arm64-${short}"
            echo "::endgroup::"
          done

  # Run a real provider call against the *just-pushed* image. Skips
  # (exit 0) when no provider modality is fully configured (all three of an
  # *_IMAGE_* / *_VIDEO_* / *_MUSIC_* API_KEY + BASE_URL + MODEL set) AND the
  # manual run-e2e flag is off — so the workflow is green before secrets exist
  # and only spends real provider calls once one is fully wired.
  e2e:
    name: E2E (real provider)
    # Depend on lint-and-test for the secrets_present gate and on `manifest` so
    # the canonical multi-arch tags the e2e pulls are already published. (The
    # `build` job only pushes per-arch `sha-<arch>-<short>` slices; the canonical
    # `sha-<short>` tag — what e2e pulls — is minted by the manifest job.)
    needs: [lint-and-test, manifest]
    runs-on: ubuntu-latest
    # Same `ci` environment as lint-and-test — the provider *_IMAGE_* /
    # *_VIDEO_* / *_MUSIC_* API_KEY secrets and *_BASE_URL / *_MODEL variables
    # are environment-scoped, so the container and the smoke script only see
    # them when the environment is declared here.
    environment: ci
    timeout-minutes: 15
    # `packages: read` lets the GITHUB_TOKEN pull the multi-arch image the build
    # job pushed to GHCR; `contents: read` is for the checkout above.
    permissions:
      contents: read
      packages: read
    if: |
      github.event_name != 'pull_request' && (
        needs.lint-and-test.outputs.secrets_present == '1' ||
        (github.event_name == 'workflow_dispatch' && inputs.run-e2e)
      )
    steps:
      - uses: actions/checkout@v4

      # The build job pushes to GHCR; pull that image on the native amd64 runner
      # (the manifest's amd64 slice). Using `--platform` guards against the rare
      # case where the runner arch wouldn't match the manifest's default.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull --platform linux/amd64 ghcr.io/${{ github.repository }}:sha-${GITHUB_SHA::7}

      - name: Start gateway
        # Pass provider keys + base URLs + pinned models through to the container
        # using the gateway's legacy env-var layout split by modality: a
        # *_IMAGE_* triple, a *_VIDEO_* triple, and a *_MUSIC_* triple per
        # provider, plus an implicit front-end key of GATEWAY_API_KEY. Only the
        # secrets you've actually set are injected — the others stay unset and
        # the gateway just doesn't register that modality. *_BASE_URL points a
        # backend at its real endpoint; *_MODEL pins/extends the backend's served
        # image/video/music model (the registry appends it to the provider's
        # model list at build time). This is the "preserve the envs" contract:
        # whatever secrets you add in GitHub, they flow straight into the image
        # 1:1.
        env:
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_IMAGE_BASE_URL: ${{ vars.OPENAI_IMAGE_BASE_URL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_VIDEO_API_KEY: ${{ secrets.OPENAI_VIDEO_API_KEY }}
          OPENAI_VIDEO_BASE_URL: ${{ vars.OPENAI_VIDEO_BASE_URL }}
          OPENAI_VIDEO_MODEL: ${{ vars.OPENAI_VIDEO_MODEL }}
          ARK_IMAGE_API_KEY: ${{ secrets.ARK_IMAGE_API_KEY }}
          ARK_IMAGE_BASE_URL: ${{ vars.ARK_IMAGE_BASE_URL }}
          ARK_IMAGE_MODEL: ${{ vars.ARK_IMAGE_MODEL }}
          ARK_VIDEO_API_KEY: ${{ secrets.ARK_VIDEO_API_KEY }}
          ARK_VIDEO_BASE_URL: ${{ vars.ARK_VIDEO_BASE_URL }}
          ARK_VIDEO_MODEL: ${{ vars.ARK_VIDEO_MODEL }}
          GOOGLE_IMAGE_API_KEY: ${{ secrets.GOOGLE_IMAGE_API_KEY }}
          GOOGLE_IMAGE_BASE_URL: ${{ vars.GOOGLE_IMAGE_BASE_URL }}
          GOOGLE_IMAGE_MODEL: ${{ vars.GOOGLE_IMAGE_MODEL }}
          GOOGLE_VIDEO_API_KEY: ${{ secrets.GOOGLE_VIDEO_API_KEY }}
          GOOGLE_VIDEO_BASE_URL: ${{ vars.GOOGLE_VIDEO_BASE_URL }}
          GOOGLE_VIDEO_MODEL: ${{ vars.GOOGLE_VIDEO_MODEL }}
          XAI_IMAGE_API_KEY: ${{ secrets.XAI_IMAGE_API_KEY }}
          XAI_IMAGE_BASE_URL: ${{ vars.XAI_IMAGE_BASE_URL }}
          XAI_IMAGE_MODEL: ${{ vars.XAI_IMAGE_MODEL }}
          XAI_VIDEO_API_KEY: ${{ secrets.XAI_VIDEO_API_KEY }}
          XAI_VIDEO_BASE_URL: ${{ vars.XAI_VIDEO_BASE_URL }}
          XAI_VIDEO_MODEL: ${{ vars.XAI_VIDEO_MODEL }}
          FLUX_IMAGE_API_KEY: ${{ secrets.FLUX_IMAGE_API_KEY }}
          FLUX_IMAGE_BASE_URL: ${{ vars.FLUX_IMAGE_BASE_URL }}
          FLUX_IMAGE_MODEL: ${{ vars.FLUX_IMAGE_MODEL }}
          FLUX_VIDEO_API_KEY: ${{ secrets.FLUX_VIDEO_API_KEY }}
          FLUX_VIDEO_BASE_URL: ${{ vars.FLUX_VIDEO_BASE_URL }}
          FLUX_VIDEO_MODEL: ${{ vars.FLUX_VIDEO_MODEL }}
