name: OpenAPI docs

# Generate the gateway's OpenAPI (Swagger) spec from source and publish it:
#
# 1. Commit ``docs/openapi.json`` back to ``main`` whenever routes/models change,
#    so the checked-in spec stays in sync with the code (consumers can fetch the
#    raw spec straight from the repo).
# 2. Deploy the spec to GitHub Pages at ``https://<owner>.github.io/<repo>/`` —
#    Swagger UI renders it read-only, no server or secrets required.
# 3. Generate a client SDK per language from the spec and push each to its
#    dedicated repo, so consumers install a typed client instead of
#    hand-rolling HTTP:
#
#    - Go        → ``sloth-os/mm-gateway-go``  (``go get github.com/sloth-os/mm-gateway-go``)
#    - Python    → ``sloth-os/mm-gateway-py``  (``pip install git+https://github.com/sloth-os/mm-gateway-py.git``)
#    - TypeScript → ``sloth-os/mm-gateway-ts`` (``npm install @sloth-os/mm-gateway-ts``)
#
#    The cross-repo push needs a PAT (the default ``GITHUB_TOKEN`` is scoped to
#    this repo) stored as the ``SDK_PUSH_TOKEN`` secret (repo Settings → Secrets
#    and variables → Actions, with ``repo`` scope on the SDK repos). When the
#    secret is absent each SDK still builds and is verified — only the push is
#    skipped, so the run stays green until the secret is configured.
#
# The OpenAPI schema is independent of provider configuration: ``create_app``
# registers every route unconditionally, and provider credentials only affect
# runtime behaviour (which models ``GET /v1/models`` lists), not the route and
# response shapes that make up the spec. So the generator builds the app with
# an empty ``Settings()`` and needs no secrets or network — the published
# ``openapi.json`` is identical to one a fully-configured gateway would serve.

on:
  push:
    branches: [main]
    paths:
      - "mm_gateway/server/**"
      - "mm_gateway/schemas/**"
      - "mm_gateway/config.py"
      - "scripts/generate_openapi.py"
      - ".github/workflows/openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "mm_gateway/server/**"
      - "mm_gateway/schemas/**"
      - "mm_gateway/config.py"
      - "scripts/generate_openapi.py"
      - ".github/workflows/openapi.yml"
  workflow_dispatch:

# Job-level permissions: least privilege. The default ``GITHUB_TOKEN`` is used
# to push the spec back to ``main`` (``contents: write``) and to deploy to Pages
# (``contents: read`` + ``pages: write`` + ``id-token: write`` for the OIDC
# deployment environment).
permissions:
  contents: write
  pages: write
  id-token: write

# Only one docs publish at a time — a newer push supersedes an in-flight one
# rather than racing it for the Pages deployment.
concurrency:
  group: openapi-docs
  cancel-in-progress: true

jobs:
  generate:
    name: Generate openapi.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        # The generator imports ``mm_gateway.server.app`` (which transitively
        # imports every provider SDK), so the full install is needed — no dev
        # deps, the generator only calls ``app.openapi()``.
        run: pip install -e .

      - name: Generate openapi.json
        run: python scripts/generate_openapi.py docs/openapi.json

      # Upload the generated spec as an artifact so it is available to the Pages
      # job below and downloadable from the run (e.g. on a PR where we don't
      # push back to main).
      - name: Upload openapi.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json
          retention-days: 14

  # Commit the freshly-generated spec back to ``main`` so the checked-in copy
  # stays in sync with the code. Skipped on PRs (no push permission to the
  # target branch) and skipped when the spec is unchanged — the generator is
  # deterministic, so a no-op run leaves the tree clean and pushes nothing.
  commit:
    name: Commit spec to main
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # ``contents: write`` permission is needed to push the commit.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Regenerate spec in-place
        # Regenerate on the checked-out ref rather than downloading the artifact
        # — keeps the commit's tree authoritative and avoids a stale-artifact
        # race on the branch the push targets.
        run: python scripts/generate_openapi.py docs/openapi.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/openapi.json; then
            echo "openapi.json unchanged — nothing to commit"
            exit 0
          fi
          git add docs/openapi.json
          git commit -m "docs(openapi): regenerate openapi.json [skip ci]

          Auto-generated by the openapi.yml workflow from the current routes and
          schemas. Co-Authored-By: Claude <noreply@anthropic.com>"
          git push

  # Build a tiny static site (Swagger UI loading the spec) and deploy it to
  # GitHub Pages. Pages must be configured once in repo Settings → Pages with
  # the source set to "GitHub Actions" — after that this job publishes on every
  # run. Fails gracefully (the spec is already committed and uploaded above) if
  # Pages isn't enabled yet.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    # Only deploy from the default branch — Pages is for published docs, not PR
    # previews.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download openapi.json artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: site

      - name: Build Swagger UI site
        # A single static page that loads the published ``openapi.json`` into
        # the official Swagger UI web component. No build toolchain — just two
        # files committed to the Pages artifact.
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>mm-gateway API</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
            <style>
              body { margin: 0; }
            </style>
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              window.onload = function () {
                window.ui = SwaggerUIBundle({
                  url: "./openapi.json",
                  dom_id: "#swagger-ui",
                  deepLinking: true,
                  docExpansion: "list",
                });
              };
            </script>
          </body>
          </html>
          HTML
          ls -la site

      - name: Configure Pages
        # Pages is enabled once on the repo (Settings → Pages, Source =
        # "GitHub Actions"); configure-pages then just reads that config to set
        # this step's base_url/base_path outputs. If Pages isn't enabled the
        # default GITHUB_TOKEN still can't create it (GitHub returns "Resource
        # not accessible by integration"), so enablement=true would just trade
        # one error for another — leave it disabled and enable Pages on the repo
        # instead. The site URL is published at https://sloth-os.github.io/mm-gateway/.
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Generate a client SDK per language from the published OpenAPI spec and push
  # each to its dedicated repo. All three jobs ``need: generate`` so they reuse
  # the freshly-built ``openapi.json`` artifact (the same spec that gets
  # committed and rendered in Swagger UI), not the checked-in copy — every
  # consumer is derived from the same bytes and none can drift.
  #
  # Generator quirks accepted once, documented per job:
  # - Go: model/api test templates emit ``_0``-suffixed methods that don't
  #   exist, so tests are skipped entirely (apiTests=false,modelTests=false).
  # - Python: the per-model tests compile fine; only the callback-style
  #   duplicate methods were a problem, and that was fixed at the spec level
  #   (duplicate ``tags`` on meta routes produced doubled method names).
  # - TypeScript: uses the ``typescript-axios`` generator (the ``typescript``
  #   generator's output needs a hand-written build harness), which emits a
  #   ready-to-compile ``tsconfig.json`` + ``package.json``.
  sdk-go:
    name: Publish Go SDK
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Bump here when refreshing the generator. Pinned to a stable release tag
      # (see https://github.com/OpenAPITools/openapi-generator/releases) — the
      # matching Docker image is openapitools/openapi-generator-cli:<tag>.
      GEN_VERSION: "7.24.0"
      SDK_REPO: sloth-os/mm-gateway-go
    steps:
      # Reuse the spec artifact rather than regenerating — keeps the SDK
      # derived from exactly the bytes the commit + Pages jobs publish.
      - name: Download openapi.json artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: spec

      - name: Generate Go SDK
        # The openapi-generator-cli image runs the generator in a container;
        # map the workspace to /local and run as the runner uid so the emitted
        # files are owned by the workspace user (not root) and can be cleaned up.
        #
        # --global-property=apiTests=false,modelTests=false skips the generated
        # ``test/`` package: the go generator's test templates emit method names
        # with a stray ``_0`` suffix (e.g. ``GetHealth_0``) that don't exist on
        # the service, so the package does not compile. (The root cause —
        # duplicated operation tags — was fixed in the spec, but the Go *test*
        # templates still mis-handle multi-tag operations, so tests stay off.)
        # Consumers write their own tests against the SDK; shipping broken
        # generated tests is worse than shipping none.
        run: |
          mkdir -p sdk-out
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/local" \
            openapitools/openapi-generator-cli:v${GEN_VERSION} generate \
              -i /local/spec/openapi.json \
              -g go \
              -o /local/sdk-out \
              --git-user-id sloth-os \
              --git-repo-id mm-gateway-go \
              --package-name mmgateway \
              --additional-properties=isGoSubmodule=false \
              --global-property=apiTests=false,modelTests=false
          # The generator emits a git_push.sh meant for manual publishing; the
          # workflow handles the push itself, so drop the helper to avoid
          # committing a stale, credential-bearing script.
          rm -f sdk-out/git_push.sh
          echo "## Generated SDK tree" >> "$GITHUB_STEP_SUMMARY"
          find sdk-out -maxdepth 2 -type f | sort | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sdk-out/go.sum

      - name: Verify SDK builds
        # ``go build ./...`` is the gate: it compiles every non-test package, so
        # a spec change that yields non-compiling Go fails here before anything
        # is published. ``go mod tidy`` first reconciles the generator's go.sum
        # (and its tidied go.mod/go.sum are what get committed). ``go vet`` is
        # deliberately NOT run: the go generator emits ``unreachable code`` in
        # the oneOf/anyOf union models (model_input_inner*.go), which fails vet
        # on every run — a generator wart, not a real defect.
        working-directory: sdk-out
        run: |
          go mod tidy
          go build ./...

      # Only publish from the default branch — PR runs generate + verify but
      # never push, so a PR can prove the SDK still builds without side effects.
      - name: Publish to sloth-os/mm-gateway-go
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SDK_PUSH_TOKEN: ${{ secrets.SDK_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_PUSH_TOKEN}" ]; then
            echo "SDK_PUSH_TOKEN secret is not set — skipping Go SDK push."
            echo "Create it in repo Settings → Secrets and variables → Actions"
            echo "with a PAT (repo scope) for ${SDK_REPO}."
            exit 0
          fi

          git clone "https://x-access-token:${SDK_PUSH_TOKEN}@github.com/${SDK_REPO}.git" target
          cd target
          # An empty target repo clones to an unborn branch — normalize to main
          # so the initial commit lands on the expected default branch.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git symbolic-ref HEAD refs/heads/main
          fi
          # Overlay the freshly generated SDK over the target tree, deleting any
          # stale files the generator no longer emits, while preserving .git.
          rsync -a --delete --exclude='.git' ../sdk-out/ .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Go SDK unchanged — nothing to push"
            exit 0
          fi
          git commit -m "chore(sdk): regenerate Go SDK from openapi spec

          Auto-generated by the openapi.yml workflow (openapi-generator-cli
          v${GEN_VERSION}) from the gateway's current routes and schemas.
          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD:main
          echo "✓ pushed Go SDK to ${SDK_REPO}" >> "$GITHUB_STEP_SUMMARY"

  # Python SDK (openapi-generator "python" generator, pydantic v2 client).
  # Published to ``sloth-os/mm-gateway-py`` so consumers install straight from
  # the repo URL (``pip install git+https://github.com/sloth-os/mm-gateway-py``)
  # or vendor the module; the SDK repo is the canonical home of the source.
  sdk-python:
    name: Publish Python SDK
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEN_VERSION: "7.24.0"
      SDK_REPO: sloth-os/mm-gateway-py
    steps:
      - name: Download openapi.json artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: spec

      - name: Generate Python SDK
        # Same container recipe as the Go job: map the workspace, run as the
        # runner uid, pin the generator version. ``--package-name`` sets both
        # the import package and the distribution name; ``packageVersion``
        # tracks the gateway's own version (FastAPI ``app.version``).
        run: |
          mkdir -p sdk-out
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/local" \
            openapitools/openapi-generator-cli:v${GEN_VERSION} generate \
              -i /local/spec/openapi.json \
              -g python \
              -o /local/sdk-out \
              --package-name mmgateway \
              --additional-properties=packageVersion=0.1.0,projectName=mm-gateway-py
          rm -f sdk-out/git_push.sh
          echo "## Generated Python SDK tree" >> "$GITHUB_STEP_SUMMARY"
          find sdk-out -maxdepth 2 -type f | sort | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify SDK builds
        # Byte-compile every generated module: a spec change that yields
        # non-compiling Python fails here before anything is published. The
        # generated model/API code imports only stdlib + pydantic, so install
        # the runtime requirements first. The generated ``test/`` package is
        # excluded from the probe (its model tests are for local dev only and
        # are trimmed below before publishing).
        working-directory: sdk-out
        run: |
          pip install --quiet -r requirements.txt
          python -m compileall -q mmgateway
          python -c "import mmgateway; print('import ok, version', mmgateway.__version__ if hasattr(mmgateway, '__version__') else '(unset)')"

      - name: Publish to sloth-os/mm-gateway-py
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SDK_PUSH_TOKEN: ${{ secrets.SDK_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_PUSH_TOKEN}" ]; then
            echo "SDK_PUSH_TOKEN secret is not set — skipping Python SDK push."
            echo "Create it in repo Settings → Secrets and variables → Actions"
            echo "with a PAT (repo scope) for ${SDK_REPO}."
            exit 0
          fi

          git clone "https://x-access-token:${SDK_PUSH_TOKEN}@github.com/${SDK_REPO}.git" target
          cd target
          # An empty target repo clones to an unborn branch — normalize to main
          # so the initial commit lands on the expected default branch.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git symbolic-ref HEAD refs/heads/main
          fi
          # Overlay the freshly generated SDK over the target tree, deleting any
          # stale files the generator no longer emits, while preserving .git.
          rsync -a --delete --exclude='.git' ../sdk-out/ .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Python SDK unchanged — nothing to push"
            exit 0
          fi
          git commit -m "chore(sdk): regenerate Python SDK from openapi spec

          Auto-generated by the openapi.yml workflow (openapi-generator-cli
          v${GEN_VERSION}) from the gateway's current routes and schemas.
          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD:main
          echo "✓ pushed Python SDK to ${SDK_REPO}" >> "$GITHUB_STEP_SUMMARY"

  # TypeScript SDK (openapi-generator ``typescript-axios`` generator). The
  # plain ``typescript`` generator (``-g typescript``) emits sources that need
  # a hand-rolled build harness before they compile, so the workflow uses
  # ``typescript-axios`` instead: it ships a ready-made ``tsconfig.json`` and
  # ``package.json``, so the verification step only needs ``npm install`` +
  # ``npm run build``. Published to ``sloth-os/mm-gateway-ts`` so consumers
  # install from the repo URL; the generated ``package.json`` is completed
  # before publishing so a follow-up job (with ``NODE_AUTH_TOKEN``) can ship it
  # to the GitHub npm registry as ``@sloth-os/mm-gateway-ts``.
  #
  # Note GEN_VERSION is per-job: the TypeScript job pins 7.25.0 (all others
  # 7.24.0) because the v7.24 typescript-axios template emits an untyped
  # ``createRequestFunction`` whose inferred return type references axios's
  # internal ``unique symbol`` declarations — fine with the axios ^1.7 pin the
  # template shipped, but not with the ^1.16 it also emitted once that version
  # existed (tsc fails with TS2527). v7.25 annotates the return type
  # (``Promise<R>``) and bumps its axios template pin, so it compiles as-is.
  sdk-typescript:
    name: Publish TypeScript SDK
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Overrides nothing — this job keeps its own version; see the comment
      # above for why it differs from the Go/Python jobs' 7.24.0 pin.
      GEN_VERSION: "7.25.0"
      SDK_REPO: sloth-os/mm-gateway-ts
    steps:
      - name: Download openapi.json artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: spec

      - name: Generate TypeScript SDK
        # Same container recipe as the Go job: map the workspace, run as the
        # runner uid, pin the generator version. ``supportsES6`` emits modern
        # classes/modules. The generated ``package.json`` is completed below
        # (scoped name, GitHub npm registry, SDK repo URL) so a follow-up
        # publish step can ship it under ``@sloth-os`` without regenerating.
        run: |
          mkdir -p sdk-out
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/local" \
            openapitools/openapi-generator-cli:v${GEN_VERSION} generate \
              -i /local/spec/openapi.json \
              -g typescript-axios \
              -o /local/sdk-out \
              --additional-properties=npmName=mm-gateway-ts,npmVersion=0.1.0,supportsES6=true
          rm -f sdk-out/git_push.sh
          # Scope the npm package to the org and point the repository field at
          # the SDK repo so a follow-up publish step can ship it under
          # ``@sloth-os`` to the GitHub npm registry. The generator derives
          # ``name`` from npmName but always emits it unscoped, so patch it.
          python3 - <<'PY'
          import json, pathlib
          pkg = pathlib.Path("sdk-out/package.json")
          data = json.loads(pkg.read_text())
          data["name"] = "@sloth-os/mm-gateway-ts"
          data["publishConfig"] = {"registry": "https://npm.pkg.github.com"}
          data["repository"] = {
              "type": "git",
              "url": "git+https://github.com/sloth-os/mm-gateway-ts.git",
          }
          pkg.write_text(json.dumps(data, indent=2) + "\n")
          print("package.json name:", data["name"])
          PY
          echo "## Generated TypeScript SDK tree" >> "$GITHUB_STEP_SUMMARY"
          find sdk-out -maxdepth 2 -type f | sort | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify SDK builds
        # ``npm install`` pulls the dev toolchain pinned in the generated
        # devDependencies (typescript); ``npm run build`` runs the generated
        # ``tsc`` build (CJS + ESM), proving the emitted ``.ts`` sources
        # compile.
        working-directory: sdk-out
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to sloth-os/mm-gateway-ts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SDK_PUSH_TOKEN: ${{ secrets.SDK_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_PUSH_TOKEN}" ]; then
            echo "SDK_PUSH_TOKEN secret is not set — skipping TypeScript SDK push."
            echo "Create it in repo Settings → Secrets and variables → Actions"
            echo "with a PAT (repo scope) for ${SDK_REPO}."
            exit 0
          fi

          git clone "https://x-access-token:${SDK_PUSH_TOKEN}@github.com/${SDK_REPO}.git" target
          cd target
          # An empty target repo clones to an unborn branch — normalize to main
          # so the initial commit lands on the expected default branch.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git symbolic-ref HEAD refs/heads/main
          fi
          # Overlay the freshly generated SDK over the target tree, deleting any
          # stale files the generator no longer emits, while preserving .git.
          # Keep node_modules out of the repo: it is reproducible from
          # package.json and would dwarf the generated sources.
          rsync -a --delete --exclude='.git' --exclude='node_modules' ../sdk-out/ .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "TypeScript SDK unchanged — nothing to push"
            exit 0
          fi
          git commit -m "chore(sdk): regenerate TypeScript SDK from openapi spec

          Auto-generated by the openapi.yml workflow (openapi-generator-cli
          v${GEN_VERSION}) from the gateway's current routes and schemas.
          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin HEAD:main
          echo "✓ pushed TypeScript SDK to ${SDK_REPO}" >> "$GITHUB_STEP_SUMMARY"
