# Example mm-gateway configuration.
#
# Copy to ./mm-gateway.yaml (or set MM_GATEWAY_CONFIG to this path) and fill in
# the ${ENV} values via environment variables. ${ENV:default} supplies a default
# when the env var is unset/empty.

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  log_format: json
  request_timeout: 120

video:
  sync_default: true
  max_sync_wait: 300
  poll_interval: 2.0

defaults:
  enable_metrics: true

# Expose the gateway as an MCP Streamable-HTTP server. Disabled by default — set
# enabled: true to mount the seven gateway tools (list_models, create_image,
# get_image, create_video, get_video, create_music, get_music) at `path`
# (default /mcp). The `mcp` package is a core dependency of the gateway; if it
# fails to import, the gateway starts and logs a warning instead of mounting the
# endpoint. The same bearer-token keys govern the MCP surface as the HTTP routes.
mcp:
  enabled: true
  path: /mcp
  # Reap a stateful MCP session after this many seconds of inactivity, so a
  # client that initialises and vanishes without DELETE cannot accumulate
  # sessions indefinitely. Default 1800 (30 min).
  session_idle_timeout: 1800

# Named, typed provider instances. Two backends of the same type are distinct
# instances (e.g. a prod and a staging Volcengine account).
backends:
  - name: volcengine-prod
    type: volcengine
    api_key: ${ARK_API_KEY}
    tags: [prod, video-primary]
  - name: openai-default
    type: openai
    api_key: ${OPENAI_API_KEY}
    tags: [prod, image-primary]
    # One backend can front a *pool* of upstream keys: list them under
    # `credentials` and auto-mode rotates among them (retrying the next key on
    # a rate-limit) and ranks them by live health. The single `api_key` above
    # stays as the default account; the list is optional.
    credentials:
      - id: primary
        api_key: ${OPENAI_API_KEY}
      - id: overflow
        api_key: ${OPENAI_API_KEY_OVERFLOW:}
  - name: openrouter-fallback
    type: openrouter
    api_key: ${OPENROUTER_API_KEY:}
    tags: [fallback]
  - name: google-default
    type: google
    api_key: ${GOOGLE_API_KEY:}
    tags: [prod]

# General pass-through proxies. A proxy forwards the *raw* request verbatim
# (method, path, query, body, headers) to an upstream root URL, injecting one
# configured account's credential as a header. The front-end caller still
# authenticates with a bearer key above and must be allowed by the proxy's
# `tags` (the same hybrid rule as backends); the upstream account key never
# reaches the client. The public URL is `/proxy/{name}/{path}`.
#
# HTTP methods, WebSocket upgrades (`/proxy/{name}/...` over ws/wss), and
# event-stream (SSE) responses are all transparent. A proxy fronts a *pool* of
# upstream accounts (like a backend with `credentials`): the request layer
# ranks them by live health and retries the next account on a rate-limit /
# timeout / upstream 5xx. Leave `accounts` out to use the top-level `api_key`
# as a single `default` account.
proxies:
  - name: openai-raw
    base_url: https://api.openai.com
    # `auth_header`+`auth_scheme` render the account credential. Default is
    # `Authorization: Bearer <key>`. For a Google-style raw-key header set
    # `auth_header: x-goog-api-key` and `auth_scheme: null`.
    auth_header: Authorization
    auth_scheme: Bearer
    tags: [prod]
    timeout: 120
    websocket: true
    # Static headers applied to every forwarded request (e.g. a required
    # `x-goog-user-project`). Per-account `headers` shadow these.
    headers: {}
    # A pool of upstream accounts. Each entry is a mapping with an optional
    # `id`/`base_url`/`headers`, or a bare string treated as an `api_key`.
    # When set, the top-level `api_key` is ignored for account enumeration.
    accounts:
      - id: primary
        api_key: ${OPENAI_PROXY_KEY_PRIMARY:}
      - id: overflow
        api_key: ${OPENAI_PROXY_KEY_OVERFLOW:}
        # Optional per-account base_url / headers override.
        # base_url: https://fallback.openai.example
        # headers: {x-account: overflow}

  - name: google-raw
    # Google-style raw-key auth + a static header the upstream requires.
    base_url: https://generativelanguage.googleapis.com
    auth_header: x-goog-api-key
    auth_scheme: null
    tags: [prod]
    headers:
      x-goog-user-project: ${GOOGLE_PROJECT:}
    accounts:
      - id: only
        api_key: ${GOOGLE_API_KEY:}

# Front-end API keys. A request authenticated with a key may use any backend
# whose tags intersect allow_tags OR whose name is in allow_backends (hybrid),
# and never any backend named in deny_tags.
keys:
  - id: alice
    key: ${FRONTEND_KEY_ALICE}
    allow_tags: [prod]                 # any prod backend
    default_image_backend: openai-default
    default_video_backend: volcengine-prod
  - id: bob
    key: ${FRONTEND_KEY_BOB}
    allow_backends: [openai-default]   # pinned to one backend by name
  - id: carol
    key: ${FRONTEND_KEY_CAROL}
    allow_tags: [prod]
    deny_tags: [video-primary]         # prod, but never the primary video backend
    default_image_tag: image-primary
