# Example mm-gateway configuration.
#
# Copy to ./mm-gateway.yaml (or set MM_GATEWAY_CONFIG to this path) and fill in
# the ${ENV} values via environment variables. ${ENV:default} supplies a default
# when the env var is unset/empty.

server:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  log_format: json
  request_timeout: 120

video:
  sync_default: true
  max_sync_wait: 300
  poll_interval: 2.0

defaults:
  enable_metrics: true

# Expose the gateway as an MCP Streamable-HTTP server. Disabled by default — set
# enabled: true to mount the seven gateway tools (list_models, create_image,
# get_image, create_video, get_video, create_music, get_music) at `path`
# (default /mcp). The `mcp` package is a core dependency of the gateway; if it
# fails to import, the gateway starts and logs a warning instead of mounting the
# endpoint. The same bearer-token keys govern the MCP surface as the HTTP routes.
mcp:
  enabled: true
  path: /mcp
  # Reap a stateful MCP session after this many seconds of inactivity, so a
  # client that initialises and vanishes without DELETE cannot accumulate
  # sessions indefinitely. Default 1800 (30 min).
  session_idle_timeout: 1800

# Named, typed provider instances. Two backends of the same type are distinct
# instances (e.g. a prod and a staging Volcengine account).
backends:
  - name: volcengine-prod
    type: volcengine
    api_key: ${ARK_API_KEY}
    tags: [prod, video-primary]
  - name: openai-default
    type: openai
    api_key: ${OPENAI_API_KEY}
    tags: [prod, image-primary]
    # One backend can front a *pool* of upstream keys: list them under
    # `credentials` and auto-mode rotates among them (retrying the next key on
    # a rate-limit) and ranks them by live health. The single `api_key` above
    # stays as the default account; the list is optional.
    credentials:
      - id: primary
        api_key: ${OPENAI_API_KEY}
      - id: overflow
        api_key: ${OPENAI_API_KEY_OVERFLOW:}
  - name: openrouter-fallback
    type: openrouter
    api_key: ${OPENROUTER_API_KEY:}
    tags: [fallback]
  - name: google-default
    type: google
    api_key: ${GOOGLE_API_KEY:}
    tags: [prod]

# General pass-through proxies. A proxy forwards the *raw* request verbatim
# (method, path, query, body, headers) to an upstream root URL, injecting one
# configured account's credential as a header. The front-end caller still
# authenticates with a bearer key above and must be allowed by the proxy's
# `tags` (the same hybrid rule as backends); the upstream account key never
# reaches the client.
#
# A proxy is matched by its upstream **domain** — the host of `base_url` — not
# by a name: the public URL is `/proxy/{domain}/{path}`. One proxy per upstream
# service, no bespoke names to remember.
#
# The upstream credential is not a special field: it lives directly on each
# account's `headers`, exactly the header line the vendor's API expects. A
# Bearer-token provider puts `authorization: Bearer <key>` there; a
# Google-style raw-key provider puts `x-goog-api-key: <key>` there — one
# provider-agnostic mechanism for any upstream. The client's copy of these
# credential headers is dropped before forwarding and the account's value is
# injected, so the upstream key never reaches the caller and cannot be
# overridden.
#
# HTTP methods, WebSocket upgrades (auto-detected from the client's
# `Upgrade: websocket` header on the same path — there is no per-proxy
# `websocket` toggle), and event-stream (SSE) responses are all transparent. A
# proxy fronts a *pool* of upstream accounts (like a backend with
# `credentials`): the request layer ranks them by live health and retries the
# next account on a rate-limit / timeout / upstream 5xx.
proxies:
  - base_url: https://api.openai.com
    tags: [prod]
    timeout: 120
    # Static headers applied to every forwarded request of every account (e.g.
    # a required `x-goog-user-project`). Per-account `headers` shadow these.
    headers: {}
    # A pool of upstream accounts. Each entry is a mapping with an optional
    # `id` and a `headers` map carrying that account's credential. The header
    # name is whatever the upstream expects — `Authorization` for OpenAI-style
    # Bearer auth.
    accounts:
      - id: primary
        headers:
          authorization: Bearer ${OPENAI_PROXY_KEY_PRIMARY:}
      - id: overflow
        headers:
          authorization: Bearer ${OPENAI_PROXY_KEY_OVERFLOW:}
        # Optional per-account `headers` override (merged over the proxy-level
        # set, account wins).
        # headers: {x-account: overflow}

  - base_url: https://generativelanguage.googleapis.com
    # Google-style raw-key auth: the credential is the `x-goog-api-key` header
    # on the account (no Bearer scheme), plus a static header the upstream
    # requires at the proxy level.
    tags: [prod]
    headers:
      x-goog-user-project: ${GOOGLE_PROJECT:}
    accounts:
      - id: only
        headers:
          x-goog-api-key: ${GOOGLE_API_KEY:}

# Front-end API keys. A request authenticated with a key may use any backend
# whose tags intersect allow_tags OR whose name is in allow_backends (hybrid),
# and never any backend named in deny_tags.
keys:
  - id: alice
    key: ${FRONTEND_KEY_ALICE}
    allow_tags: [prod]                 # any prod backend
    default_image_backend: openai-default
    default_video_backend: volcengine-prod
  - id: bob
    key: ${FRONTEND_KEY_BOB}
    allow_backends: [openai-default]   # pinned to one backend by name
  - id: carol
    key: ${FRONTEND_KEY_CAROL}
    allow_tags: [prod]
    deny_tags: [video-primary]         # prod, but never the primary video backend
    default_image_tag: image-primary
