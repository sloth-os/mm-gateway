[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-gateway"
version = "0.1.0"
description = "Unified image / video / AI gateway. OpenAI- and OpenRouter-compatible on the front; multi-provider on the back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "mm-gateway" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "openai>=1.40",
    "google-genai>=1.0",
    "dashscope>=1.20",
    "stability-sdk>=0.2",
    "volcengine-python-sdk>=5.0",
    "xai-sdk>=1.0",
    "runapi-flux-2>=0.3",
    "openrouter>=1.0",
    "pillow>=10.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mm-gateway = "mm_gateway.server.app:run"

[tool.setuptools.packages.find]
include = ["mm_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
