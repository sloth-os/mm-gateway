[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-gateway"
version = "0.1.0"
description = "Provider-neutral image, video, and music generation gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sloth", email = "sloth.os@outlook.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "openai>=1.40",
    "google-genai>=2.19",
    "dashscope>=1.20",
    "stability-sdk>=0.2",
    "volcengine-python-sdk>=5.0",
    "runapi-flux-2>=0.3",
    "openrouter>=1.0",
    "elevenlabs>=2.0",
    "pillow>=10.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
# SOCKS5 outbound-proxy support. HTTP (CONNECT) proxies need no extra dep on the
# httpx paths or the WebSocket bridge (built in); SOCKS5 needs a transport shim
# per client:
#   - httpx (most providers + the proxy HTTP forwarder): ``socksio`` (SOCKS only)
#   - websockets (the proxy WebSocket bridge): ``python-socks`` (SOCKS only)
#   - aiohttp (the dashscope SDK's async path): ``aiohttp-socks`` — needed for ANY
#     explicit proxy (HTTP or SOCKS), since the SDK speaks aiohttp and we route it
#     through an ``aiohttp_socks.ProxyConnector``
# An operator who routes outbound traffic through a SOCKS proxy (or sets an
# explicit proxy on a dashscope backend) installs this extra
# (``pip install mm-gateway[socks]``); HTTP-only, non-dashscope deployments skip it.
socks = [
    "socksio>=1.0",
    "python-socks>=2.0",
    "aiohttp-socks>=0.10",
]

[project.scripts]
mm-gateway = "mm_gateway.server.app:run"

[tool.setuptools.packages.find]
include = ["mm_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the project root on sys.path so test modules can do
# `from tests.conftest import ...` and `mm_gateway` is importable even when
# pytest is invoked as a console script (CI runs `pytest -q`, not
# `python -m pytest -q`, so cwd is not otherwise on sys.path).
pythonpath = ["."]
